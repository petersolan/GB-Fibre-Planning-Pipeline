# GitLab CI: the same checks as .github/workflows/ci.yml.
# Stages run in order; a failure stops the pipeline.
stages: [lint, test, build]

default:
  image: condaforge/miniforge3:latest
  interruptible: true

variables:
  CONDA_PKGS_DIRS: "$CI_PROJECT_DIR/.conda-pkgs"
  KEDRO_DISABLE_TELEMETRY: "1"

.conda_env:
  cache:
    key:
      files: [environment.yml]
    paths: [.conda-pkgs/]
  before_script:
    - conda env create -q -f environment.yml
    - source activate fibre
    - pip install --no-deps -e .

lint:
  stage: lint
  extends: .conda_env
  script:
    - ruff check src tests migrations
    - ruff format --check src tests migrations
    - mypy src

test:
  stage: test
  extends: .conda_env
  services:
    - name: postgis/postgis:17-3.5
      alias: postgis
  variables:
    # Throwaway credentials for the CI service container only; real secrets
    # belong in masked, protected CI/CD variables
    POSTGRES_DB: fibre
    POSTGRES_USER: fibre_owner
    POSTGRES_PASSWORD: ci-only-password
    POSTGRES_HOST: postgis
    POSTGRES_PORT: "5432"
    API_DB_USER: fibre_reader
    API_DB_PASSWORD: ci-only-reader
  script:
    - alembic upgrade head
    - alembic downgrade base
    - alembic upgrade head
    - pytest -q --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA" .
    # Push only from the default branch, with the job's own short-lived token
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
        docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
      fi
