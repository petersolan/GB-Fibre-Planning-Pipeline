# Console stays human-readable (Rich); pipeline monitoring events also go to
# logs/pipeline.jsonl, one JSON object per line, ready for a log collector.
version: 1
disable_existing_loggers: false

formatters:
  json_line:
    format: "%(message)s"

handlers:
  rich:
    class: kedro.logging.RichHandler
    rich_tracebacks: true
  monitoring_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json_line
    filename: logs/pipeline.jsonl
    maxBytes: 10485760  # 10 MB
    backupCount: 5
    encoding: utf-8
    delay: true

loggers:
  kedro:
    level: INFO
  fibre_planning:
    level: INFO
  fibre_planning.monitoring:
    level: INFO
    handlers: [monitoring_file]

root:
  handlers: [rich]
