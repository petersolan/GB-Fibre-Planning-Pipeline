# Area to plan for: an ONS local authority district code. Each area's results are
# kept side by side in PostGIS; the default is in globals.yml
area:
  lad_code: ${runtime_params:area.lad_code, ${globals:default_area}}

boundary_api:
  url: https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services/LAD_MAY_2025_UK_BGC_V2/FeatureServer/0/query
  code_field: LAD25CD
  name_field: LAD25NM

# Outputs of the GB-Census-Population-Map project (population per UPRN)
census:
  directory: ../Census-distribution/data/processed

ofcom:
  zip_path: data/01_raw/ofcom/ofcom_fixed_202601.zip
  postcode_glob: fixed_pc_coverage_r2_

roads:
  zip_path: data/01_raw/os_open_roads/oproad_essh_gb.zip
  buffer_m: 500          # also read roads just outside the boundary
  columns: [identifier, function, name1, startNode, endNode]

analysis:
  max_drop_m: 150        # premises further than this from any road are left unassigned
  # Road types an address can't be served from: without this, farms beside the M5
  # snapped to it and made a 15.6 km motorway link a "gap street" in Mid Devon
  no_drop_functions: [Motorway]
  min_people_to_rank: 1  # rank only road links serving at least this many people without gigabit

# Routing (pgRouting): connect gap streets to the existing gigabit network
routing:
  # A link "has gigabit" when its premises all do; their junctions are where new cable starts
  min_premises_for_existing: 1
  # Build cost per metre relative to a local road (digging under busier roads costs more)
  cost_multiplier:
    Motorway: 10.0
    A Road: 3.0
    B Road: 2.0
    Minor Road: 1.2
    Local Road: 1.0
    Local Access Road: 1.0
    Restricted Local Access Road: 1.0
    Secondary Access Road: 1.0
  default_multiplier: 1.0
  # Indicative civil works (trenching where no duct exists) per metre of local road;
  # Openreach figure reported by ISPreview (2017). Excludes equipment, drops and reuse
  # of existing ducts or poles, so treat results as relative, order-of-magnitude costs
  civils_gbp_per_m: 100
